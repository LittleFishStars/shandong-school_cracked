<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闪动校园 · 阳光跑工作台</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">SD</span>
    <div>
      <div class="title">闪动校园 · 阳光跑工作台</div>
      <div class="subtitle">协议复原版 · 登录 → 阳光跑 → 数据记录 → 数据上传</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="pill" id="pill-mode" title="运行模式">模式：--</span>
    <span class="pill" id="pill-login" title="登录状态">未登录</span>
    <span class="pill mono" id="pill-device" title="deviceId">设备：--</span>
    <span class="pill mono" id="pill-version">v--</span>
    <button class="btn ghost" id="btn-data-dir">数据目录</button>
  </div>
</header>

<main class="layout">
  <!-- ═══════════ 左栏：登录与跑步 ═══════════ -->
  <section class="col col-left">
    <div class="card">
      <div class="card-head">
        <h2>① 登录</h2>
        <span class="hint" id="login-hint">真实服务端登录</span>
      </div>
      <div class="card-body">
        <label class="field">
          <span>登录方式</span>
          <select id="in-login-mode" class="mini">
            <option value="real">真实登录（api.huachenjie.com）</option>
            <option value="mock">本地登录（离线调试，不联网）</option>
          </select>
        </label>
        <label class="field">
          <span>手机号 / 学号</span>
          <input id="in-phone" type="text" value="13800138000" placeholder="13800138000" autocomplete="off">
        </label>
        <label class="field">
          <span>密码</span>
          <input id="in-password" type="password" placeholder="任意（Mock 模式不校验）">
        </label>
        <label class="check">
          <input type="checkbox" id="in-captcha" checked>
          <span>走滑块验证码流程（可关闭以加速调试）</span>
        </label>
        <div class="row">
          <button class="btn primary" id="btn-login">登录</button>
          <button class="btn" id="btn-logout">退出</button>
        </div>
        <label class="field">
          <span>历史账号</span>
          <select id="in-account" class="mini">
            <option value="">（本机登录过的账号会出现在这里）</option>
          </select>
        </label>
        <div class="row">
          <button class="btn" id="btn-account-use" disabled>使用该账号</button>
          <button class="btn" id="btn-account-del" disabled>移除</button>
        </div>
        <div class="kv" id="user-info"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>② 阳光跑</h2>
        <span class="hint">跑步参数（别的操作都在地图卡的「高级 / 调试」里）</span>
      </div>
      <div class="card-body">
        <div class="row2">
          <label class="field">
            <span>目标距离（米）</span>
            <input id="in-distance" type="number" value="2000" min="500" step="100">
          </label>
          <label class="field">
            <span>围栏</span>
            <select id="in-fence"><option value="0">默认（第 1 个）</option></select>
          </label>
        </div>
        <div class="row2">
          <label class="field">
            <span>步频下限（步/分）</span>
            <input id="in-cad-lo" type="number" value="172" step="1">
          </label>
          <label class="field">
            <span>步频上限（步/分）</span>
            <input id="in-cad-hi" type="number" value="182" step="1">
          </label>
        </div>
        <div class="row2">
          <label class="field">
            <span>步幅（米）</span>
            <input id="in-stride" type="number" value="0.85" step="0.01">
          </label>
          <label class="field">
            <span>服务端注入失败率</span>
            <input id="in-failrate" type="number" value="0" min="0" max="1" step="0.05"
                   title="Mock 服务端随机失败，用来验证断点续传">
          </label>
        </div>
        <div class="row2">
          <label class="field" title="摇杆推到底时的速度（1 m/s = 3.6 km/h；正常慢跑 2.2~2.8）">
            <span>摇杆速度（m/s）</span>
            <input id="in-walk-speed" type="number" value="2.5" min="0.5" max="6" step="0.1">
          </label>
          <label class="field" title="实走只支持真实时间（1 倍速）：摇杆实走本来就是看手感的，不是跑完就走">
            <span>实走倍速</span>
            <input id="in-walk-rate" type="number" value="1" min="1" max="1" step="0" readonly
                   title="固定 1 倍速：实走按真实时间推进">
          </label>
        </div>
        <div class="row2">
          <label class="check" title="到达目标里程自动结束后，直接补传轨迹并提交结算（不开则只停不结）">
            <input id="in-auto-settle" type="checkbox" checked> 到达目标自动结算
          </label>
        </div>
        <div class="row2">
          <label class="check" title="打开后按真实时间推进数据写入，能看到轨迹一笔笔画出来">
            <input id="in-realtime" type="checkbox"> 实时仿真（便于观察）
          </label>
          <label class="field">
            <span>仿真倍速</span>
            <input id="in-speed" type="number" value="8" min="0.5" step="1"
                   title="8 = 8 倍速（耗时约为真实跑步的 1/8）">
          </label>
        </div>
        <div class="row">
          <span class="hint">③ 开始跑步 · ④ 结束跑步 在中间地图卡上方；整场仿真在「高级 / 调试」里</span>
        </div>
        <div class="progress">
          <div class="progress-bar"><i id="progress-fill" style="width:0%"></i></div>
          <div class="progress-text" id="progress-text">就绪</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>④ 学校规则（SchoolRule）</h2>
        <button class="btn ghost small" id="btn-load-rule">刷新</button>
      </div>
      <div class="card-body"><div class="kv" id="rule-info">尚未加载</div></div>
    </div>
  </section>

  <!-- ═══════════ 中栏：地图与事件流 ═══════════ -->
  <section class="col col-mid">
    <div class="card map-card">
      <div class="card-head">
        <h2>轨迹与围栏</h2>
        <span class="hint" id="map-hint">高德路网 · GCJ-02</span>
      </div>
      <div class="map-bar flow-bar" id="flow-bar">
        <button class="btn small primary" id="btn-prepare"
                title="拉取电子围栏 / 学校规则 / 打卡点，并自动把地图移到电子围栏处">① 拉取配置</button>
        <button class="btn small" id="btn-pick-start"
                title="在地图上点一下就是跑步起点（落在围栏外会自动吸附进围栏）；不选则用围栏中心">② 选择起始点</button>
        <button class="btn small primary" id="btn-walk-real"
                title="在地图上画出打卡路径，然后升跑并开始记录轨迹（实时写入本地库）">③ 开始跑步</button>
        <button class="btn small" id="btn-flow-end" disabled
                title="停止记录，并把本次轨迹上传结算">④ 结束跑步</button>
        <span class="hint" id="flow-info">第 ① 步：先在左栏登录</span>
      </div>
      <div class="card-body map-body">
        <div id="map"></div>
        <details class="adv" id="adv-tools">
          <summary>高级 / 调试</summary>
          <div class="adv-body">
            <div class="adv-row">
              <button class="btn small" id="btn-walk-dry" title="只推位置与数据，不升跑、不落库、不上传，纯调路径">干跑调试</button>
              <button class="btn small" id="btn-walk-stop" disabled>停止</button>
              <button class="btn small" id="btn-walk-pause" disabled title="暂停时计时与计步都停，结算上报 pauseCount/pauseTimes">暂停</button>
              <button class="btn small" id="btn-walk-up" title="停止后按与一键跑完全相同的链路上传并结算">上传结算</button>
              <button class="btn ghost small" id="btn-walk-save" title="把本次路径存成本地草稿，不升跑不上传">存草稿</button>
            </div>
            <div class="adv-row">
              <button class="btn small" id="btn-plan" title="按打卡点最近邻连成一条闭环，只画出来不跑">只规划路径</button>
              <button class="btn small" id="btn-pick" title="在地图上依次点击，画出一条自定义路线">点选路点</button>
              <button class="btn ghost small" id="btn-clear-wp">清路点</button>
              <button class="btn ghost small" id="btn-clear-start" disabled title="取消自定义起点，回到围栏中心">清除起点</button>
              <button class="btn ghost small" id="btn-fit">适应</button>
            </div>
            <div class="adv-row">
              <button class="btn small" id="btn-run" title="不用在地图上走，直接按仿真参数跑完一整场并上传">一键跑完整链路</button>
              <button class="btn small" id="btn-resume">断点续传</button>
              <button class="btn small" id="btn-save-cfg">保存参数</button>
              <button class="btn ghost small" id="btn-reset-device">换 deviceId</button>
            </div>
            <div class="adv-row">
              <select id="in-tiles" class="mini" title="底图瓦片源（记录坐标是 GCJ-02，高德瓦片同为 GCJ-02）">
                <option value="amap">高德路网</option>
                <option value="amap-sat">高德卫星</option>
                <option value="osm">OpenStreetMap</option>
                <option value="none">无底图</option>
              </select>
              <label class="check small"><input type="checkbox" id="in-show-state" checked>
                <span>按上传状态着色</span></label>
            </div>
          </div>
        </details>
        <div class="map-legend">
          <span><i class="sw route"></i>规划路线</span>
          <span><i class="sw wpt"></i>路点</span>
          <span><i class="sw fence"></i>围栏</span>
          <span><i class="sw start"></i>起点</span>
          <span><i class="sw cp"></i>打卡点</span>
          <span><i class="sw init"></i>待上传</span>
          <span><i class="sw fail"></i>失败</span>
          <span><i class="sw succ"></i>已上传</span>
        </div>
      </div>
      <!-- 摇杆与「自动跑」常驻地图卡右下角：默认手动，点了「自动跑」才沿路线自动走。
           注意它挂在卡片上（不在 .map-body 里）——地图区 overflow:hidden，
           窗口一矮/提示行变长就会把绝对定位的摇杆整块裁掉（2026-10-18 实测）。 -->
      <div class="run-ctl" id="run-ctl">
        <button class="btn small" id="btn-auto-run"
                title="默认手动：用右下角摇杆控制方向。点这里切到自动沿规划路线跑，再点一次交回摇杆">手动（摇杆）</button>
        <div class="joy" id="joy" title="拖动控制方向；松手即停；也可用方向键（自动跑时推杆即接管）">
          <div class="joy-ring"></div>
          <div class="joy-knob" id="joy-knob"></div>
        </div>
      </div>
    </div>

    <div class="card log-card">
      <div class="card-head">
        <h2>事件流</h2>
        <div class="head-tools">
          <label class="check small"><input type="checkbox" id="in-autoscroll" checked>
            <span>自动滚动</span></label>
          <button class="btn ghost small" id="btn-clear-log">清屏</button>
        </div>
      </div>
      <div class="card-body log-body"><div class="log" id="log"></div></div>
    </div>
  </section>

  <!-- ═══════════ 右栏：本次跑步与记录 ═══════════ -->
  <section class="col col-right">
    <div class="card run-now">
      <div class="card-head">
        <h2>本次跑步</h2>
        <span class="hint" id="run-code-label">--</span>
      </div>
      <div class="card-body"><div class="kv" id="run-info">尚未开始</div></div>
    </div>

    <div class="card server-records">
      <div class="card-head">
        <h2>服务器记录</h2>
        <div class="head-tools">
          <span class="hint" id="runs-page">第 1 页</span>
          <button class="btn ghost small" id="btn-runs-prev" disabled title="上一页（服务端分页）">上一页</button>
          <button class="btn ghost small" id="btn-runs-next" disabled title="下一页（服务端分页）">下一页</button>
          <button class="btn ghost small" id="btn-refresh-runs" title="重新从服务端拉取当前页">刷新</button>
        </div>
      </div>
      <div class="card-body list-body">
        <div class="runs" id="runs"></div>
      </div>
    </div>
  </section>
</main>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
