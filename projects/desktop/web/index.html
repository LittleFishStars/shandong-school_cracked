<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>闪动校园 · 阳光跑工作台</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="views">
  <!-- ═══════════ 登录页 ═══════════ -->
  <section class="view" id="view-login">
    <div class="login-layout">
      <div class="login-brand">
        <div class="logo-badge">⚡</div>
        <div class="login-brand-name">闪动校园</div>
      </div>
      <div class="login-card">
        <div class="login-form" id="login-form-new">
          <label class="field">
            <span>手机号</span>
            <input id="in-phone" type="text" value="13800138000" placeholder="手机号 / 学号" autocomplete="off">
          </label>
          <label class="field">
            <span>密码</span>
            <input id="in-password" type="password" placeholder="账号密码">
          </label>
          <div class="login-actions">
            <button class="login-btn" id="btn-login">登录</button>
            <button class="login-link" id="btn-switch-account">选择已有账号</button>
          </div>
        </div>

        <div class="login-form" id="login-form-account" hidden>
          <label class="field">
            <span>选择账号</span>
            <select id="in-account"><option value="">请选择</option></select>
          </label>
          <div class="login-actions">
            <button class="login-btn" id="btn-account-use" disabled>登录</button>
            <button class="login-link" id="btn-switch-new">登录新账号</button>
          </div>
          <button class="login-link login-remove" id="btn-account-del" hidden>移除该账号</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ═══════════ 首页（未开跑） ═══════════ -->
  <section class="view" id="view-home">
    <div class="run-layout">
      <div class="map-card">
        <div class="map-slot" id="slot-home"><div id="map"></div></div>
      </div>
      <aside class="side-panel">
        <div class="side-brand"><div class="logo-badge">⚡</div></div>
        <label class="target-pill">
          <span>目标距离</span>
          <select id="in-distance" title="目标距离：按学校规则的单次距离区间，从高到低每 1 km 一个选项"></select>
        </label>
        <div class="side-actions">
          <button class="btn-start" id="btn-walk-real" title="在地图上画出打卡路径，然后升跑并开始记录轨迹">开始</button>
          <button class="btn-more" id="btn-more" title="参数 / 规则 / 记录 / 事件流">更多</button>
        </div>
        <div class="progress">
          <div class="progress-bar"><i id="progress-fill" style="width:0%"></i></div>
          <div class="progress-text" id="progress-text">就绪</div>
        </div>
      </aside>
    </div>
  </section>

  <!-- ═══════════ 选起始点页 ═══════════ -->
  <section class="view" id="view-pick">
    <div class="pick-head">
      <span class="pick-title">选择起始点</span>
      <button class="btn primary small" id="btn-pick-confirm">确认</button>
    </div>
    <div class="pick-map" id="slot-pick"></div>
  </section>

  <!-- ═══════════ 跑步页 ═══════════ -->
  <section class="view" id="view-run">
    <div class="run-layout">
      <div class="map-card">
        <div class="map-slot" id="slot-run"></div>
      </div>
      <aside class="side-panel">
        <div class="live-stats">
          <div class="live-line"><span>距离</span><b id="live-distance">--</b></div>
          <div class="live-line"><span>配速</span><b id="live-pace">--</b></div>
        </div>
        <div class="run-ctl" id="run-ctl">
          <div class="joy" id="joy" title="拖动控制方向；松手即停；也可用方向键（自动跑时推杆即接管）">
            <div class="joy-ring"></div>
            <div class="joy-knob" id="joy-knob"></div>
          </div>
        </div>
        <button class="btn-end" id="btn-flow-end" disabled title="停止记录，并把本次轨迹上传结算">结束</button>
      </aside>
    </div>
  </section>

  <!-- ═══════════ 更多页 ═══════════ -->
  <section class="view" id="view-more">
    <div class="more-head">
      <h1>更多</h1>
      <button class="btn ghost small" id="btn-more-back">返回</button>
    </div>
    <div class="more-grid">
      <div class="card">
        <div class="card-head"><h2>跑步参数</h2></div>
        <div class="card-body">
          <label class="field">
            <span>运行模式</span>
            <select id="in-login-mode">
              <option value="real">真实服务端</option>
              <option value="mock">本地 Mock</option>
            </select>
          </label>
          <label class="field">
            <span>围栏</span>
            <select id="in-fence"><option value="0">默认（第 1 个）</option></select>
          </label>
          <div class="row2">
            <label class="field" title="平均步频：每分钟步数；后端按“平均 ± 波动”生成每段步频">
              <span>平均步频（步/分）</span>
              <input id="in-cad-avg" type="number" value="177" min="120" max="240" step="1">
            </label>
            <label class="field" title="波动：每段步频在平均值上下随机浮动 ±N 步/分">
              <span>波动（± 步/分）</span>
              <input id="in-cad-var" type="number" value="5" min="0" max="30" step="1">
            </label>
          </div>
          <div class="row2">
            <label class="field">
              <span>步幅（米）</span>
              <input id="in-stride" type="number" value="0.85" step="0.01">
            </label>
            <label class="field" title="摇杆推满时的配速，格式 6'40&quot; 或 6:40（也可直接填秒/公里）">
              <span>配速（分'秒&quot;/公里）</span>
              <input id="in-walk-pace" type="text" value="6'40&quot;" placeholder="6'40&quot;" autocomplete="off">
            </label>
          </div>
          <label class="check" title="到达目标里程自动结束后，直接补传轨迹并提交结算（不开则只停不结）">
            <input id="in-auto-settle" type="checkbox" checked> 到达目标自动结算
          </label>
          <div class="row">
            <button class="btn small" id="btn-save-cfg">保存参数</button>
            <button class="btn ghost small" id="btn-reset-device">换 deviceId</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>学校规则</h2>
          <button class="btn ghost small" id="btn-load-rule">刷新</button>
        </div>
        <div class="card-body"><div class="kv" id="rule-info">尚未加载</div></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>账号</h2></div>
        <div class="card-body">
          <div class="kv" id="user-info"></div>
          <div class="row">
            <button class="btn ghost small" id="btn-data-dir">数据目录</button>
            <button class="btn ghost small" id="btn-logout">退出登录</button>
          </div>
        </div>
      </div>

      <div class="card run-now">
        <div class="card-head">
          <h2>本次跑步</h2>
          <span class="hint" id="run-code-label">--</span>
        </div>
        <div class="card-body"><div class="kv" id="run-info">尚未开始</div></div>
      </div>

      <div class="card">
        <div class="card-head"><h2>地图与起点</h2></div>
        <div class="card-body">
          <div class="row">
            <button class="btn small" id="btn-pick-start">选择起始点</button>
            <button class="btn ghost small" id="btn-clear-start" disabled title="取消自定义起点，回到围栏中心">清除起点</button>
            <button class="btn ghost small" id="btn-fit">适应</button>
          </div>
          <div class="row">
            <select id="in-tiles" class="mini" title="底图瓦片源（记录坐标是 GCJ-02，高德瓦片同为 GCJ-02）">
              <option value="amap">高德路网</option>
              <option value="amap-sat">高德卫星</option>
              <option value="osm">OpenStreetMap</option>
              <option value="none">无底图</option>
            </select>
            <label class="check small"><input type="checkbox" id="in-show-state" checked>
              <span>按上传状态着色</span></label>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h2>高级 / 调试</h2></div>
        <div class="card-body">
          <div class="row">
            <button class="btn small" id="btn-walk-dry" title="只推位置与数据，不升跑、不落库、不上传，纯调路径">干跑调试</button>
            <button class="btn small" id="btn-walk-stop" disabled>停止</button>
            <button class="btn small" id="btn-walk-pause" disabled title="暂停时计时与计步都停，结算上报 pauseCount/pauseTimes">暂停</button>
            <button class="btn small" id="btn-walk-up" title="停止后按与一键跑完全相同的链路上传并结算">上传结算</button>
            <button class="btn ghost small" id="btn-walk-save" title="把本次路径存成本地草稿，不升跑不上传">存草稿</button>
          </div>
          <div class="row">
            <button class="btn small" id="btn-plan" title="按打卡点最近邻连成一条闭环，只画出来不跑">只规划路径</button>
            <button class="btn small" id="btn-pick" title="在地图上依次点击，画出一条自定义路线">点选路点</button>
            <button class="btn ghost small" id="btn-clear-wp">清路点</button>
          </div>
          <div class="row">
            <button class="btn small" id="btn-run" title="不用在地图上走，直接按仿真参数跑完一整场并上传">一键跑完整链路</button>
            <button class="btn small" id="btn-resume">断点续传</button>
            <button class="btn ghost small" id="btn-auto-run"
                    title="手动（摇杆）/ 自动沿规划路线跑，再点一次交回摇杆">手动（摇杆）</button>
          </div>
        </div>
      </div>

      <div class="card records-card">
        <div class="card-head">
          <h2>服务器记录</h2>
          <div class="head-tools">
            <span class="hint" id="runs-page">第 1 页</span>
            <button class="btn ghost small" id="btn-runs-prev" disabled title="上一页（服务端分页）">上一页</button>
            <button class="btn ghost small" id="btn-runs-next" disabled title="下一页（服务端分页）">下一页</button>
            <button class="btn ghost small" id="btn-refresh-runs" title="重新从服务端拉取当前页">刷新</button>
          </div>
        </div>
        <div class="card-body list-body">
          <div class="runs" id="runs"></div>
        </div>
      </div>

      <div class="card log-card">
        <div class="card-head">
          <h2>事件流</h2>
          <div class="head-tools">
            <label class="check small"><input type="checkbox" id="in-autoscroll" checked>
              <span>自动滚动</span></label>
            <button class="btn ghost small" id="btn-clear-log">清屏</button>
          </div>
        </div>
        <div class="card-body log-body"><div class="log" id="log"></div></div>
      </div>
    </div>
  </section>
</main>

<div class="toast-wrap" id="toast-wrap"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
