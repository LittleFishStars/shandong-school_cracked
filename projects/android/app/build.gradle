// 闪动校园 · 安卓版 —— 原生壳构建脚本（纯 Java，不引入 Kotlin 插件）
// 版本组合已实测通过：AGP 8.13.2 + Gradle 9.3.1 + JDK 21 + Chaquopy 17.1.0 + Python 3.12
plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// 正式签名材料只放 local.properties（.gitignore 已忽略），口令不进仓库
def keystoreProps = new Properties()
def lpFile = rootProject.file('local.properties')
if (lpFile.exists()) {
    lpFile.withInputStream { keystoreProps.load(it) }
}
def hasReleaseKey = keystoreProps.getProperty('shandong.storeFile') != null

android {
    namespace 'com.ylxc.shandong'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "com.ylxc.shandong"
        minSdk 24
        targetSdk 36
        // 与桌面版 __version__ 对齐（app/src/main/python/shandong_school_cracked/__init__.py）
        // versionCode 用 MAJOR*10000+MINOR*100+PATCH，递增关系直观且不会回退
        versionCode 30000
        versionName "3.0.0-pre1"
        ndk {
            // 仅保留真机 + 模拟器两个 ABI，减小包体
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(keystoreProps.getProperty('shandong.storeFile'))
                storePassword keystoreProps.getProperty('shandong.storePassword')
                keyAlias keystoreProps.getProperty('shandong.keyAlias')
                keyPassword keystoreProps.getProperty('shandong.keyPassword')
            }
        }
    }

    buildFeatures {
        // 需要 BuildConfig.DEBUG：debug 包默认走本地 Mock，release 包默认真实服务端
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            // 有正式密钥就用正式签名；没配（例如别人克隆仓库）则保持未签名
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // debug 包：BuildConfig.DEBUG = true → Python 侧默认 mode=mock
            // （避免调试时误连真实服务端、误产生真实跑步记录）
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

chaquopy {
    defaultConfig {
        // 固定 Python 3.12（Chaquopy 17.x 的 Pillow wheel 在 cp312 最稳）
        version = '3.12'
        // 注意：Chaquopy 17.x 的 buildPython 是 List<String>（用于命令+参数），
        // 不能用 String 直接赋值，需包一层列表。可通过 -PbuildPython=/path 覆盖。
        def bp = (project.findProperty('buildPython') ?: '/home/ylxc/.local/bin/python3.12')
        buildPython = [bp]
        pip {
            // 显式指定 Pillow 版本 + Chaquopy 预编译 wheel 源（默认已配，保险起见显式写出）
            options "--index-url", "https://pypi.org/simple/",
                    "--extra-index-url", "https://chaquo.com/pypi-13.1/"
            install 'pillow==11.0.0'
        }
    }
}